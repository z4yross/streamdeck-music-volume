name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did on the dial, what you expected, and what the dial showed instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Rotate the dial ...
        3. See ...
    validations:
      required: true
  - type: input
    id: player
    attributes:
      label: Music player
      description: Which app and version was the dial following, or should have followed.
      placeholder: Spotify 1.2.x, Deezer desktop 7.x
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio setup
      description: Default output device, and whether you use Voicemeeter or another virtual output.
      placeholder: Realtek speakers, no virtual outputs
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      description: Shown in Stream Deck under the plugin's entry, or `Version` in the manifest.
      placeholder: 0.2.0.0
    validations:
      required: true
  - type: input
    id: streamdeck
    attributes:
      label: Stream Deck software version
      placeholder: 7.0.3
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `com.z4yross.musicvol.sdPlugin/logs/`. Remove anything you consider private first.
      render: text
